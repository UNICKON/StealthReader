<html><head><title>在爸爸朋友的公司上班，把我上到有点破防了</title></head><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"detail": {"thread": {"tid": "643064746", "title": "在爸爸朋友的公司上班，把我上到有点破防了", "content": "<p>上一份工作公司搬太远，我就辞了。后来我爸朋友的公司，说有个岗位跟我特别对口，我爸说对方答应双休、工资还挺高，就力推我去。结果面试的时候老板（我爸朋友）跟我谈的条件跟我爸说的根本不一样，工资待遇都对不上。但我爸在场，当朋友聊天呢，我不好意思说啥什么，想着能接受就答应了。</p><p></p><p>结果上班之后，离谱的事一件接一件：</p><p></p><p>1. 说好的双休变大小周。 跟我爸说双休，跟我谈大小周。老板还来一句“比你之前假期多了，很好了”，我当场无语。第一次小周周六去上班，整个办公室就我一个人，新来的也没什么活，坐那对着电脑摸鱼，但还得去。后来老板带我干活，可能看我情绪不对，说“以后熟悉了给你双休，两个月差不多”，经理也说三个月。我就靠这句话撑着，打算满三个月提双休。</p><p></p><p>2. 工资低，一人干三个岗。 工资开得是真不高。一个人岗位的工资，可以接受。公司缺人，周一开会直接给我加了两个岗位的活，现在一个人干三个岗。因为一人三岗，全办公室同事都是我领导，哪一个同事都能给我派活。</p><p></p><p>3. 老板娘下班后夺命连环call。 周五她安排一堆活，说了优先级。我做完当天必须交的已经快下班了，她安排的只做了一点。晚上7点多她发个3秒语音我没看到，马上语音打过来质问我为什么没做她安排的活。我解释，她没听完就态度很不好地挂了，发信息问我“一天究竟做了什么”。我回了工作内容，9点多她又拍了我当天的工作成果再质问一遍，有些做完的我已经交经理了，我又解释，她没回。</p><p></p><p>4. 休息日发长文说我“本该上班”。 这周我双休，正常休息。她上班时间发现我没去，发一大段消息说我今天本该上班，还说我干活慢、公司不是没事干、别老看手机（我看手机是在回经理信息，跟同事对接）。我周五睡得晚，一觉睡到12点才看到，不想回也不知道怎么回。我明明按排班正常休假，什么叫本该上班？给她惯着呢？干不完的活留到上班干，又不是急活，周一做完全不影响。好好的休息日，心情全毁了。</p><p></p><p>5. 熟人公司，就我没加班费。 夫妻制小公司，我爸跟老板老板娘是朋友。但这不是我当牛马的理由啊。办公室其他人周六上班都有加班费，就我没有。 工资不加，岗位拼命加。本来还想跟老板谈双休，被老板娘这么一闹，我都不敢开口了，怕被驳回。</p><p></p><p>6. 老板娘反驳型人格，还甩锅。 第一面见她就觉得不好惹。她是反驳型人格，按她说的做，做错了她说她没说过，还是我背锅。下班还逮着我薅，我感觉做的久了会破防。一个人干三个岗位，累得要死。</p><p></p><p>今晚跟好朋友深入分析了一番，觉得这种事情有第一次就会有第二次，熟人公司真是“不熟不吃”。</p><p>今晚喝了奶茶睡不着，想到明天回去上班她肯定还得喷我，有点顶不住。</p><div class=\"slate-image\" style=\"margin:0 auto\"><p><img src=\"https://i5.hoopchina.com.cn/3abca834eebe8d6d48302368e70ba905_w_640_h_620_.jpg?imageMogr2/format/webp/auto-orient?x-oss-process=image/resize,w_800/format,webp\"></p></div>", "video": "", "videoCover": "", "lights": 23, "replies": 88, "read": 57866, "createdAt": 1792349559000, "createdAtFormat": "8小时前", "author": {"puid": "116066851", "euid": "68448322647143", "puname": "星眠赴野", "level": 3, "header": "https://i1.hoopchina.com.cn/user/bf6ab9b67e626d1cda8f61102cdf5b50_w_1079_h_1079_.jpg@150h_150w_2e", "url": "https://my.hupu.com/68448322647143", "groupIds": [-1], "isBlacked": false, "isAdmin": false}}, "replies": {"count": 6, "list": [{"pid": "70868", "content": "<p>离了这份工作活不了吗，这还惯着他们</p>", "allLightCount": 455, "createdAt": 1792350618000, "createdAtFormat": "8小时前", "author": {"puid": "50621828", "euid": "190694520196773", "puname": "喜欢puppy", "header": "https://i3.hoopchina.com.cn/user/50621828/1733202501519.jpg@150h_150w_2e", "url": "https://my.hupu.com/190694520196773", "groupIds": [-1], "isBlacked": false, "isAdmin": false}, "replyNum": 3}, {"pid": "71125", "content": "<p>赶紧辞职吧，沾亲带故活别干。干活你是员工他是老板，论报酬就跟你谈感情开始道德绑架了。</p>", "allLightCount": 262, "createdAt": 1792351391000, "createdAtFormat": "7小时前", "author": {"puid": "85369749", "euid": "221959472037282", "puname": "虎扑JR0802525070", "header": "https://i1.hoopchina.com.cn/user/default/light1.png@150h_150w_2e", "url": "https://my.hupu.com/221959472037282", "groupIds": [-1], "isBlacked": false, "isAdmin": false}, "replyNum": 1}, {"pid": "71280", "content": "<p>趁早换工作吧，人家也没拿你当熟人，你也就别顾着那根本不存在的情面了。<br>不过现在工作确实难找。</p><p><img src=\"https://i5.hoopchina.com.cn/newsPost/1732070304762_o_w_148_h_148_d882d03d.png?x-oss-process=image/resize,w_800/format,webp\"/></p>", "allLightCount": 44, "createdAt": 1792351733000, "createdAtFormat": "7小时前", "author": {"puid": "96068383", "euid": "167256753313530", "puname": "虎扑JR0323566764", "header": "https://i1.hoopchina.com.cn/user/default/light3.png@150h_150w_2e", "url": "https://my.hupu.com/167256753313530", "groupIds": [-1], "isBlacked": false, "isAdmin": false}, "replyNum": 1}, {"pid": "71300", "content": "<p>所以你是没长嘴么？不会跟你爸反馈？老板娘装鸡毛你不会怼么？还是说你没把实际情况完整的讲清楚，有自己的考量，所以忍下来了</p>", "allLightCount": 92, "createdAt": 1792351782000, "createdAtFormat": "7小时前", "author": {"puid": "56384731", "euid": "232593126168084", "puname": "虎扑JR0147694981", "header": "https://i1.hoopchina.com.cn/user/default/tiger3.png@150h_150w_2e", "url": "https://my.hupu.com/232593126168084", "groupIds": [-1], "isBlacked": false, "isAdmin": false}, "replyNum": 0}, {"pid": "74895", "content": "<p>给我看笑了，都是惯出来的，我垃圾三本毕业就退休，十几年没上过班，亲戚朋友都不敢招惹我。</p><p><img src=\"https://i3.hoopchina.com.cn/newsPost/1736235158495_o_w_300_h_270_92ae5266.JPG?x-oss-process=image/resize,w_800/format,webp\"/></p>", "allLightCount": 111, "createdAt": 1792364847000, "createdAtFormat": "4小时前", "author": {"puid": "119460052", "euid": "215449117355563", "puname": "老大再肘我一次O_o", "header": "https://i1.hoopchina.com.cn/user/177b0baa12a4e70269f7b3acb39fbf18_w_89_h_89_.jpg@150h_150w_2e", "url": "https://my.hupu.com/215449117355563", "groupIds": [-1], "isBlacked": false, "isAdmin": false}, "replyNum": 5}, {"pid": "75251", "content": "<p>走吧 你说不合适</p>", "allLightCount": 0, "createdAt": 1792365468000, "createdAtFormat": "4小时前", "author": {"puid": "31560137", "euid": "238198017405778", "puname": "精精神神", "header": "https://i3.hoopchina.com.cn/user/31560137/1762257796207.jpg@150h_150w_2e", "url": "https://my.hupu.com/238198017405778", "groupIds": [-1], "isBlacked": false, "isAdmin": false}, "replyNum": 0}]}, "breadCrumb": [{"title": "社区", "url": "/"}, {"title": "步行街", "url": "/all-gambia"}, {"title": "步行街主干道", "url": "/topic-daily"}, {"title": "在爸爸朋友的公司上班...", "url": "/643064746.html"}]}}}}</script></body></html>
